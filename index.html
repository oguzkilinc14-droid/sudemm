<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sudem 💖</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffd1e8, #fff5fa);
    color: #6b003f;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 50px 20px;
}

h1 {
    font-size: 48px;
}

/* FOTOĞRAF */
.photo-box {
    margin: 40px auto;
    max-width: 500px;
}
.photo-box img {
    width: 100%;
    border-radius: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

/* YAZI */
.text-box {
    background: rgba(255,255,255,0.9);
    padding: 40px;
    border-radius: 30px;
    font-size: 18px;
    line-height: 2;
    margin: 40px 0;
}

/* VIDEO */
.video-box {
    margin: 40px 0;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}
iframe {
    width: 100%;
    height: 500px;
    border: none;
}

/* 🔥 TÜM EKRAN KARARMA */
#fullscreenOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 56px;
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s;
    z-index: 9999;
}
</style>
</head>

<body>

<!-- FULLSCREEN KARARMA -->
<div id="fullscreenOverlay">
    Seni Seviyorum ❤️
</div>

<!-- MÜZİK -->
<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <h1>Sudem 💕</h1>
    <p>Mia & Sebastian’s Theme eşliğinde…</p>

    <!-- FOTOĞRAF -->
    <div class="photo-box">
        <img src="photo.jpg" alt="Biz">
    </div>

    <!-- YAZI -->
    <div class="text-box">
        <p>🌸 Sudem,</p>
        <p>
            Hayatıma girdiğin günden beri her şey daha güzel.  
            Seninle geçen her an kalbimde özel bir yer edindi 💞
        </p>
        <p>
            <strong>Seni çok seviyorum</strong> 💖  
            Ve ne olursa olsun  
            <strong>seni asla bırakmayacağım</strong> 🤍
        </p>
        <p>
            Bu site sadece sana…  
            Kalbim gibi 💗
        </p>
    </div>

    <!-- VIDEO -->
    <div class="video-box">
        <iframe
            id="videoFrame"
            src="https://drive.google.com/file/d/1zmvMox-4bFs8YZioepWnD_rU-X1n2nO5/preview"
            allow="autoplay">
        </iframe>
    </div>

</div>

<script>
const music = document.getElementById("music");
const video = document.getElementById("videoFrame");
const overlay = document.getElementById("fullscreenOverlay");

let overlayTimerStarted = false;

/* Sayfa açılınca müzik başlasın */
window.addEventListener("click", () => {
    if (music.paused) {
        music.volume = 0.6;
        music.play();
    }
}, { once: true });

/* Videoya girince */
video.addEventListener("mouseenter", () => {
    music.pause();

    if (!overlayTimerStarted) {
        overlayTimerStarted = true;
        setTimeout(() => {
            overlay.style.opacity = "1";
        }, 20000); // 🔥 videoya başladıktan 20 sn sonra
    }
});

/* Videodan çıkınca */
video.addEventListener("mouseleave", () => {
    music.play();
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sudem 💖</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffd1e8, #fff5fa);
    color: #6b003f;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 50px 20px;
}

h1 {
    font-size: 48px;
}

/* FOTOĞRAF */
.photo-box {
    margin: 40px auto;
    max-width: 500px;
}
.photo-box img {
    width: 100%;
    border-radius: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

/* YAZI */
.text-box {
    background: rgba(255,255,255,0.9);
    padding: 40px;
    border-radius: 30px;
    font-size: 18px;
    line-height: 2;
    margin: 40px 0;
}

/* VIDEO */
.video-box {
    position: relative;
    margin: 40px 0;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}
iframe {
    width: 100%;
    height: 500px;
    border: none;
}

/* SADECE VIDEO KARARMA */
.video-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 48px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 1s;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="container">

    <h1>Sudem 💕</h1>
    <p>Mia & Sebastian’s Theme eşliğinde…</p>

    <!-- 🎵 MÜZİK -->
    <div style="margin: 30px 0;">
        <audio controls>
            <source src="music.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- FOTOĞRAF -->
    <div class="photo-box">
        <img src="photo.jpg" alt="Biz">
    </div>

    <!-- 🔄 YAZI ARTIK VİDEODAN ÖNCE -->
    <div class="text-box">
        <p>🌸 Sudem,</p>

        <p>
            Hayatıma girdiğin günden beri her şey daha güzel.  
            Seninle geçen her an kalbimde özel bir yer edindi 💞
        </p>

        <p>
            <strong>Seni çok seviyorum</strong> 💖  
            Ve ne olursa olsun  
            <strong>seni asla bırakmayacağım</strong> 🤍
        </p>

        <p>
            Bu site sadece sana…  
            Kalbim gibi 💗
        </p>
    </div>

    <!-- VIDEO -->
    <div class="video-box">
        <iframe
            src="https://drive.google.com/file/d/1zmvMox-4bFs8YZioepWnD_rU-X1n2nO5/preview"
            allow="autoplay">
        </iframe>

        <div class="video-overlay" id="overlay">
            Seni Seviyorum ❤️
        </div>
    </div>

</div>

<script>
/*
Google Drive video JS ile kontrol edilemediği için
ortalama video süresine göre çalışır
*/
setTimeout(() => {
    document.getElementById("overlay").style.opacity = "1";
}, 20000); // süreyi istersen değiştir
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sudem 💖</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f6c1d1;
    text-align: center;
}

.container {
    padding: 40px;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: #ff5c8a;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #ff3f73;
}

.photo-box img {
    width: 300px;
    border-radius: 20px;
    margin-top: 30px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Sudem 💖</h1>
    <p>Mia & Sebastian's Theme eşliğinde...</p>

    <button onclick="playMusic()">🎵 Müziği Başlat</button>

    <br><br>

    <!-- SES KONTROLÜ (ÖNEMLİ) -->
    <audio id="bgMusic" controls>
        <source src="music.mp3" type="audio/mpeg">
        Tarayıcı ses dosyasını desteklemiyor.
    </audio>

    <div class="photo-box">
        <img src="photo.jpg" alt="Biz">
    </div>
</div>

<script>
function playMusic() {
    const music = document.getElementById("bgMusic");
    music.play().catch(e => {
        alert("Tarayıcı müziği engelledi, alttaki oynatıcıdan başlat 💖");
    });
}
</script>

</body>
</html>

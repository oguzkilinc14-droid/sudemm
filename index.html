<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sudem 💖</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffd1e8, #fff5fa);
    color: #6b003f;
    text-align: center;
    overflow-x: hidden;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 50px 20px;
    display: none;
}

h1 {
    font-size: 48px;
}

/* INTRO */
#intro {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #ff9acb, #ffd1e8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}
#intro h2 {
    font-size: 36px;
}
#intro button {
    margin-top: 30px;
    padding: 18px 45px;
    font-size: 20px;
    border: none;
    border-radius: 50px;
    background: #ff5fa8;
    color: white;
    cursor: pointer;
}

/* FOTO */
.photo-box {
    margin: 40px auto;
    max-width: 500px;
}
.photo-box img {
    width: 100%;
    border-radius: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

/* YAZI */
.text-box {
    background: rgba(255,255,255,0.9);
    padding: 40px;
    border-radius: 30px;
    font-size: 18px;
    line-height: 2;
    margin: 40px 0;
}

/* VIDEO */
.video-box {
    margin: 40px 0;
}
video {
    width: 100%;
    border-radius: 30px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

/* KARARMA */
#fullscreenOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 56px;
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s;
    z-index: 999;
}

/* DAKTİLO */
.type {
    border-right: 2px solid #6b003f;
    padding-right: 5px;
}

/* KALPLER */
.heart {
    position: fixed;
    bottom: -20px;
    font-size: 24px;
    animation: fly 8s linear infinite;
    opacity: 0.7;
}
@keyframes fly {
    from { transform: translateY(0); }
    to { transform: translateY(-110vh); }
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
    <h2>Sana bir sürprizim var 💖</h2>
    <button onclick="startStory()">Başla</button>
</div>

<!-- KARARMA -->
<div id="fullscreenOverlay" onclick="removeOverlay()">
    Seni Seviyorum ❤️
</div>

<div class="container" id="content">

    <h1>Sudem 💕</h1>
    <p>Dünyanın en güzel kadınına... </p>

    <!-- GİZLİ MÜZİK -->
    <audio id="music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- FOTO -->
    <div class="photo-box">
        <img src="photo.jpg" alt="Biz">
    </div>

    <!-- YAZI -->
    <div class="text-box">
        <p class="type" id="typeText"></p>
    </div>

    <!-- VIDEO -->
    <div class="video-box">
        <video id="video" controls>
            <source src="video.mp4" type="video/mp4">
            Tarayıcın videoyu desteklemiyor.
        </video>
    </div>

</div>

<script>
/* DAKTİLO METNİ */
const text = `🌸 Sevgilim,

Hayatıma girdiğin günden beri çok değiştim.
Beni çok geliştirdin, daha iyi bir insan olmamı sağladın
ve her zaman yanımda oldun.

Hayatının ne kadar zor olduğunu biliyorum buna rağmen
asla pes etmedin.
Bu ilişki için, benim için hep çabaladın.

Zor zamanlarımız oldu, daha da olacak belki
ama ben hep yanında olacağım.
Her şeyi birlikte aşacağız.

Seni çok seviyorum 💖  
Ve ne olursa olsun seni asla bırakmayacağım 🤍  

Yılbaşın kutlu olsun 🎄  
Birlikte geçireceğimiz nice yıllara…

Bu site sadece sana 💗
`;

let i = 0;
function typeWriter() {
    if (i < text.length) {
        document.getElementById("typeText").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
    }
}

/* KALPLER */
function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 8000);
    }, 500);
}

/* BAŞLA */
const music = document.getElementById("music");
const video = document.getElementById("video");
const overlay = document.getElementById("fullscreenOverlay");
let overlayTimer;

function startStory() {
    document.getElementById("intro").style.display = "none";
    document.getElementById("content").style.display = "block";

    music.play();          // 🎵 otomatik başlar
    typeWriter();
    startHearts();
}

/* VIDEO / MÜZİK SENKRON */
video.addEventListener("play", () => {
    music.pause();

    overlayTimer = setTimeout(() => {
        overlay.style.opacity = "1";
        overlay.style.pointerEvents = "auto";
    }, 22000);
});

video.addEventListener("pause", () => {
    music.play();
    clearTimeout(overlayTimer);
});

/* KARARMA KAPAT */
function removeOverlay() {
    overlay.style.opacity = "0";
    overlay.style.pointerEvents = "none";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sudem 💖</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffd1e8, #fff5fa);
    color: #6b003f;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 50px 20px;
}

h1 {
    font-size: 48px;
}

/* MÜZİK BUTONU */
.music-btn {
    background: #ff5fa8;
    color: white;
    border: none;
    padding: 16px 35px;
    border-radius: 40px;
    font-size: 17px;
    cursor: pointer;
    margin: 25px 0;
}
.music-btn:hover {
    background: #ff3f98;
}

/* FOTOĞRAF */
.photo-box {
    margin: 40px auto;
    max-width: 500px;
}
.photo-box img {
    width: 100%;
    border-radius: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

/* VIDEO */
.video-box {
    margin: 40px 0;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    cursor: pointer;
}
iframe {
    width: 100%;
    height: 500px;
    border: none;
}

/* METİN */
.text-box {
    background: rgba(255,255,255,0.9);
    padding: 40px;
    border-radius: 30px;
    font-size: 18px;
    line-height: 2;
}

/* KARARMA EKRANI */
#overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
}

#overlay h2 {
    color: white;
    font-size: 48px;
    animation: fadeIn 2s ease forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<!-- 🎵 ARKA PLAN MÜZİĞİ -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- 🌑 KARARMA -->
<div id="overlay">
    <h2>Seni seviyorum 💖</h2>
</div>

<div class="container">

    <h1>Sudem 💕</h1>
    <p>Mia & Sebastian’s Theme eşliğinde…</p>

    <button class="music-btn" onclick="playMusic()">
        🎵 Müziği Başlat
    </button>

    <!-- 📸 FOTOĞRAF -->
    <div class="photo-box">
        <img src="photo.jpg" alt="Biz">
    </div>

    <!-- 🎬 VIDEO -->
    <div class="video-box" onclick="showOverlay()">
        <iframe
            src="https://drive.google.com/file/d/1zmvMox-4bFs8YZioepWnD_rU-X1n2nO5/preview"
            allow="autoplay">
        </iframe>
    </div>

    <!-- 💌 METİN -->
    <div class="text-box">
        <p>🌸 Sudem,</p>

        <p>
            Hayatıma girdiğin günden beri her şey daha güzel.  
            Seninle geçen her an kalbimde özel bir yer edindi 💞
        </p>

        <p>
            <strong>Seni çok seviyorum</strong> 💖  
            Ve ne olursa olsun  
            <strong>seni asla bırakmayacağım</strong> 🤍
        </p>

        <p>
            Bu site sadece sana…  
            Kalbim gibi 💗
        </p>
    </div>

</div>

<script>
function playMusic() {
    const music = document.getElementById("bgMusic");

    music.volume = 1;
    music.currentTime = 0;

    music.play();
}
</script>



</body>
</html>
